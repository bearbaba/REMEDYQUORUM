name: GenLayer contracts Python CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile contracts/*.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
